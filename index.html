<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>合同审查清单</title>
<style>
  body {
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    max-width: 720px;
    margin: 40px auto;
    padding: 0 20px;
    color: #1f2328;
    line-height: 1.7;
  }
  h1 { font-size: 24px; border-bottom: 2px solid #d0d7de; padding-bottom: 8px; }
  ol li { margin: 10px 0; }
  .tip { color: #59636e; font-size: 14px; margin-top: 32px; }
</style>
</head>
<body>
<h1>合同审查清单</h1>
<p>对照下列要点逐项检查合同文本，全部为演示用虚构条目。</p>
<ol id="checklist">
  <li>核对合同主体名称是否准确</li>
  <li>检查违约责任条款是否对等</li>
  <li>检查付款方式与付款节点是否明确</li>
  <li>检查签署页授权与盖章是否完备</li>
  <li>检查争议解决方式（诉讼或仲裁）是否约定清楚</li>
</ol>
<p class="tip">本页面为教程演示项目，内容全部虚构。</p>
<button id="exportBtn">导出 Word</button>
<script>
  document.getElementById('exportBtn').addEventListener('click', function () {
    var html = '<html xmlns:w="urn:schemas-microsoft-com:office:word">' +
               document.documentElement.outerHTML + '</html>';
    var blob = new Blob([html], { type: 'application/msword' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '合同审查清单.doc';
    a.click();
    URL.revokeObjectURL(a.href);
  });
</script>
</body>
</html>
